<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MD TRACK GPS Congo - 5 Trucks Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#000;color:#fff}
#map{height:80vh}
.header{background:#000;color:gold;padding:14px;text-align:center;font-weight:bold;border-bottom:3px solid gold;font-size:16px}
.sub{background:gold;color:#000;padding:8px;text-align:center;font-weight:bold;font-size:13px}
.btn{background:#25D366;color:#fff;display:block;padding:16px;text-align:center;text-decoration:none;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="header">🇨🇩 MD TRACK GPS Congo - LIVE Fleet Lubumbashi ↔ Kolwezi - 330km</div>
<div class="sub">🚛 5 Trucks En Route • Dotted Route Active • TRK-008 • TRK-012 • TRK-015 • TRK-023 • TRK-031 • 42km/h Avg</div>
<div id="map"></div>
<a class="btn" href="https://wa.me/27817070456">💬 CONTACTER SUR WHATSAPP 0817070456</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Map center Congo mining corridor
var map=L.map('map').setView([-10.95,26.2],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);

// Lubumbashi to Kolwezi route with waypoints
var route=[
[-11.664,27.482],
[-11.2,26.9],
[-10.9,26.2],
[-10.716,25.472]
];

// BLACK DOTTED ROUTE - visible on light map
L.polyline(route,{
color:'#000',
weight:5,
dashArray:'14,14',
opacity:0.9,
lineCap:'round'
}).addTo(map);

// Gold dotted overlay for premium look
L.polyline(route,{
color:'gold',
weight:2,
dashArray:'14,14',
opacity:0.7
}).addTo(map);

// Pins
L.marker([-11.664,27.482]).addTo(map).bindPopup("<b>LUBUMBASHI</b><br>Mining Hub - Start");
L.marker([-10.716,25.472]).addTo(map).bindPopup("<b>KOLWEZI</b><br>Copper Capital - Destination");

// 5 Trucks spread across 330km
var trucks=[
{id:'TRK-008',pos:0.05,speed:68},
{id:'TRK-012',pos:0.28,speed:45},
{id:'TRK-015',pos:0.50,speed:52},
{id:'TRK-023',pos:0.73,speed:48},
{id:'TRK-031',pos:0.92,speed:40}
];

var markers=trucks.map(t=>{
let lat=route[0][0]+(route[3][0]-route[0][0])*t.pos;
let lng=route[0][1]+(route[3][1]-route[0][1])*t.pos;
return L.marker([lat,lng],{
icon:L.divIcon({
html:'<div style="background:gold;color:#000;padding:5px 9px;border-radius:14px;font-weight:bold;font-size:12px;border:2px solid #000;box-shadow:0 2px 6px rgba(0,0,0,0.4)">'+t.id+'</div>',
className:'',
iconSize:[70,28]
})
}).addTo(map).bindPopup('<b>'+t.id+'</b><br>Speed: '+t.speed+' km/h<br>En Route<br>Lubumbashi → Kolwezi');
});

// Animate trucks along dotted route
setInterval(()=>{
markers.forEach((m,i)=>{
trucks[i].pos+=0.0015;
if(trucks[i].pos>1) trucks[i].pos=0;
let lat=route[0][0]+(route[3][0]-route[0][0])*trucks[i].pos;
let lng=route[0][1]+(route[3][1]-route[0][1])*trucks[i].pos;
m.setLatLng([lat,lng]);
});
},100);
</script>
</body>
</html>
